<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Public Navbar -->
    <nav th:fragment="public-navbar" class="navbar">
        <div class="navbar-top">
            <a th:href="@{/}" class="navbar-logo" style="text-decoration: none; color: inherit;">LOGO</a>
            <div class="navbar-search">
                <input type="text" placeholder="Rechercher un produit..." class="search-bar">
            </div>
            <div class="navbar-actions">
                <a th:href="@{/cart}" class="navbar-link">🛒 Panier</a>
                <a th:href="@{/user/login}" class="navbar-link btn-login-nav">Se connecter</a>
            </div>
        </div>
        <div class="navbar-categories">
            <a th:href="@{/products}" class="category-link">Tous les produits</a>
            <a th:href="@{/user/products(category='ordinateur')}" class="category-link">Ordinateurs</a>
            <a th:href="@{/user/products(category='smartphone')}" class="category-link">Smartphones</a>
            <a th:href="@{/user/products(category='accessoire')}" class="category-link">Accessoires</a>
        </div>
    </nav>

    <!-- User Navbar -->
    <nav th:fragment="user-navbar" class="navbar">
        <div class="navbar-top">
            <a th:href="@{/user/dashboard}" class="navbar-logo">Logo</a>
            <div class="navbar-search">
                <input type="text" id="searchInput" placeholder="Barre de recherche" class="search-bar">
            </div>
            <div class="navbar-actions">
                <a th:href="@{/user/profile}" class="navbar-link">Profil</a>
                <a th:href="@{/user/cart}" class="navbar-link">Panier</a>
            </div>
        </div>
        <div class="navbar-categories">
            <a th:href="@{/user/products}" class="category-link">Tous les produits</a>
            <span th:each="cat : ${categories}">
                <a th:href="@{/user/products(categoryId=${cat['id']})}" class="category-link" th:text="${cat['name']}"></a>
            </span>
        </div>
    </nav>

    <!-- Admin Navbar -->
    <nav th:fragment="admin-navbar(activePage)" class="navbar admin-nav">
        <div class="navbar-top">
            <a th:href="@{/admin/dashboard}" class="navbar-logo">Logo</a>
            <div class="navbar-search">
                <input type="text" id="searchInput" placeholder="Barre de recherche" class="search-bar">
            </div>
            <div class="navbar-actions">
                <a th:href="@{/admin/profile}" class="navbar-link" th:classappend="${activePage} == 'profile' ? ' active' : ''">Profil</a>
                <a th:href="@{/admin/logout}" class="navbar-link">Déconnexion</a>
            </div>
        </div>
        <div class="navbar-categories">
            <a th:href="@{/admin/products}" class="category-link">Tous les produits</a>
            <a th:href="@{/admin/products(category='ordinateur')}" class="category-link">Ordinateur</a>
            <a th:href="@{/admin/products(category='smartphone')}" class="category-link">smartphone</a>
            <a th:href="@{/admin/products(category='accessoires')}" class="category-link">Accessoires</a>
        </div>
        <div class="navbar-categories">
            <a th:href="@{/admin/CRUD/users}" class="category-link" th:classappend="${activePage} == 'users' ? ' active' : ''">Utilisateurs</a>
            <a th:href="@{/admin/CRUD/products}" class="category-link" th:classappend="${activePage} == 'products' ? ' active' : ''">Produits</a>
            <a th:href="@{/admin/CRUD/orders}" class="category-link" th:classappend="${activePage} == 'orders' ? ' active' : ''">Commandes</a>
        </div>
    </nav>
</body>
</html>
