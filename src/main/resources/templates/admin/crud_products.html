<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard admin - crud produit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin/product-list.css}">
        
</head>
<body class="dashboard-page">
    <div th:replace="fragments/navbar :: admin-navbar('products')"></div>

    <div class="container">
        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>titre</th>
                        <th>descriptif</th>
                        <th>category</th>
                        <th>prix</th>
                        <th>stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr class="product-row" th:each="product : ${products}">
                        <td class="product-details">
                            <div class="product-detail-text" th:text="${product.name} + ' / ' + ${product.description} + ' / ' + ${product.category} + ' / €' + ${product.price} + ' / ' + ${product.stock}">titre / descriptif / category / prix / stock</div>
                        </td>
                        <td class="product-actions">
                            <button class="btn-edit" th:onclick="'editProduct(' + ${product.id} + ')'" title="Éditer">Modifier</button>
                            <button class="btn-delete" th:onclick="'deleteProduct(' + ${product.id} + ')'" title="Supprimer">supprimer</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

        <div id="noResults" class="no-results" style="display: none;">
            <p>Aucun produit ne correspond à vos critères de recherche.</p>
        </div>

        <div class="pagination-controls">
            <button class="page-btn">← Précédent</button>
            <span class="page-info">Page 1 sur 5</span>
            <button class="page-btn">Suivant →</button>
        </div>
    </div>
</body>
</html>
