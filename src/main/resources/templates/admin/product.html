<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Éditer produit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin/product.css}">
</head>
<body class="dashboard-page">
        <div th:replace="fragments/navbar :: admin-navbar('products')"></div>

    <div class="container">
        <a th:href="@{/admin/products}" class="btn-secondary" style="margin-bottom: 20px;">← Retour à la liste</a>

        <div class="product-form-container">
            <div class="form-header">
                <h1 th:text="${product.id != null ? 'Éditer le produit' : 'Ajouter un nouveau produit'}">Éditer produit</h1>
                <p class="subtitle" th:text="${product.id != null ? 'Modifiez les détails du produit' : 'Créez un nouveau produit'}">Remplissez le formulaire ci-dessous</p>
            </div>

            <form th:action="${product.id != null ? @{/admin/product/{id}(id=${product.id})} : @{/admin/product}}" method="post" class="product-form">
                <!-- Onglets -->
                <div class="form-tabs">
                    <button type="button" class="tab-btn active" onclick="switchTab('general')">📋 Informations générales</button>
                    <button type="button" class="tab-btn" onclick="switchTab('images')">🖼️ Images</button>
                    <button type="button" class="tab-btn" onclick="switchTab('pricing')">💰 Tarification</button>
                    <button type="button" class="tab-btn" onclick="switchTab('stock')">📊 Stock</button>
                    <button type="button" class="tab-btn" onclick="switchTab('seo')">🔍 SEO</button>
                </div>

                <!-- Onglet Général -->
                <div id="general" class="tab-section active">
                    <h3>Informations du produit</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Nom du produit *</label>
                            <input type="text" id="name" name="name" th:value="${product.name}" placeholder="Entrez le nom du produit" required>
                        </div>
                        <div class="form-group">
                            <label for="sku">SKU/Code *</label>
                            <input type="text" id="sku" name="sku" th:value="${product.sku}" placeholder="PROD-001" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Catégorie *</label>
                            <select id="category" name="category" required>
                                <option value="electronics" th:selected="${product.category == 'electronics'}">Électronique</option>
                                <option value="clothing" th:selected="${product.category == 'clothing'}">Vêtements</option>
                                <option value="home" th:selected="${product.category == 'home'}">Maison</option>
                                <option value="sports" th:selected="${product.category == 'sports'}">Sports</option>
                                <option value="other" th:selected="${product.category == 'other'}">Autre</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="brand">Marque</label>
                            <input type="text" id="brand" name="brand" th:value="${product.brand}" placeholder="Nom de la marque">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description *</label>
                        <textarea id="description" name="description" rows="5" required th:text="${product.description}" placeholder="Décrivez le produit en détail..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="shortDescription">Description courte</label>
                        <textarea id="shortDescription" name="shortDescription" rows="2" th:text="${product.shortDescription}" placeholder="Résumé du produit (pour les listes)"></textarea>
                    </div>
                </div>

                <!-- Onglet Images -->
                <div id="images" class="tab-section">
                    <h3>Gestion des images</h3>
                    <div class="image-upload-section">
                        <div class="image-preview">
                            <img id="mainImage" th:src="${product.imageUrl}" alt="Aperçu" style="max-width: 200px; border-radius: 4px;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="imageUrl">Image principale *</label>
                            <input type="url" id="imageUrl" name="imageUrl" th:value="${product.imageUrl}" placeholder="https://exemple.com/image.jpg" required onchange="updateImagePreview()">
                            <small>Ou <a href="#" onclick="openFileUpload(event)">télécharger une image</a></small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Images supplémentaires (galerie)</label>
                        <div class="gallery-images">
                            <div class="gallery-item" th:each="img : ${product.galleryImages}">
                                <img th:src="${img}" alt="Galerie">
                                <button type="button" class="btn-remove" onclick="removeGalleryImage(this)">✕</button>
                            </div>
                        </div>
                        <button type="button" class="btn-secondary" onclick="addGalleryImage()">➕ Ajouter une image</button>
                    </div>
                </div>

                <!-- Onglet Tarification -->
                <div id="pricing" class="tab-section">
                    <h3>Tarification</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Prix de vente (€) *</label>
                            <input type="number" id="price" name="price" th:value="${product.price}" step="0.01" min="0" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="cost">Prix de coût (€)</label>
                            <input type="number" id="cost" name="cost" th:value="${product.cost}" step="0.01" min="0" placeholder="0.00">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="discountPrice">Prix remisé (€)</label>
                            <input type="number" id="discountPrice" name="discountPrice" th:value="${product.discountPrice}" step="0.01" min="0" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="discountPercent">Remise (%)</label>
                            <input type="number" id="discountPercent" name="discountPercent" th:value="${product.discountPercent}" min="0" max="100" placeholder="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="weight">Poids (kg)</label>
                        <input type="number" id="weight" name="weight" th:value="${product.weight}" step="0.01" placeholder="0.00">
                    </div>

                    <div class="info-box">
                        <p>Marge bénéficiaire : <strong id="margin">0%</strong></p>
                    </div>
                </div>

                <!-- Onglet Stock -->
                <div id="stock" class="tab-section">
                    <h3>Gestion du stock</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="stock">Quantité en stock *</label>
                            <input type="number" id="stock" name="stock" th:value="${product.stock}" min="0" required placeholder="0">
                        </div>
                        <div class="form-group">
                            <label for="lowStockAlert">Alerte stock faible</label>
                            <input type="number" id="lowStockAlert" name="lowStockAlert" th:value="${product.lowStockAlert}" min="0" placeholder="10">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="maxStock">Stock maximum</label>
                            <input type="number" id="maxStock" name="maxStock" th:value="${product.maxStock}" min="0" placeholder="1000">
                        </div>
                        <div class="form-group">
                            <label><input type="checkbox" id="trackStock" th:checked="${product.trackStock}"> Activer le suivi du stock</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="barcode">Code-barres</label>
                        <input type="text" id="barcode" name="barcode" th:value="${product.barcode}" placeholder="1234567890">
                    </div>
                </div>

                <!-- Onglet SEO -->
                <div id="seo" class="tab-section">
                    <h3>Optimisation pour les moteurs de recherche (SEO)</h3>
                    <div class="form-group">
                        <label for="seoTitle">Titre SEO</label>
                        <input type="text" id="seoTitle" name="seoTitle" maxlength="60" th:value="${product.seoTitle}" placeholder="Titre pour les moteurs de recherche (max 60 caractères)">
                        <small id="titleCount">0/60</small>
                    </div>

                    <div class="form-group">
                        <label for="seoDescription">Meta description</label>
                        <textarea id="seoDescription" name="seoDescription" rows="3" maxlength="160" th:text="${product.seoDescription}" placeholder="Description pour les moteurs de recherche (max 160 caractères)"></textarea>
                        <small id="descCount">0/160</small>
                    </div>

                    <div class="form-group">
                        <label for="seoKeywords">Mots-clés</label>
                        <input type="text" id="seoKeywords" name="seoKeywords" th:value="${product.seoKeywords}" placeholder="mot-clé1, mot-clé2, mot-clé3">
                    </div>

                    <div class="form-group">
                        <label for="seoUrl">URL friendly</label>
                        <input type="text" id="seoUrl" name="seoUrl" th:value="${product.seoUrl}" placeholder="url-du-produit">
                    </div>
                </div>

                <!-- Informations supplémentaires -->
                <div class="form-section">
                    <h3>Statut et options</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="status">Statut *</label>
                            <select id="status" name="status" required>
                                <option value="active" th:selected="${product.status == 'active'}">Actif</option>
                                <option value="inactive" th:selected="${product.status == 'inactive'}">Inactif</option>
                                <option value="draft" th:selected="${product.status == 'draft'}">Brouillon</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><input type="checkbox" id="featured" name="featured" th:checked="${product.featured}"> Produit en vedette</label>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <button type="submit" class="btn-primary">💾 Enregistrer le produit</button>
                    <a th:href="@{/admin/products}" class="btn-secondary">Annuler</a>
                    <button type="button" class="btn-danger" onclick="deleteProduct()" th:if="${product.id != null}">🗑 Supprimer</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/admin/product.js}"></script>

    <style>
        .product-form-container {
            background: white;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-header h1 {
            color: #2c3e50;
            margin: 0 0 5px 0;
        }

        .subtitle {
            color: #999;
            margin: 0;
        }

        .form-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            padding: 10px 15px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: #666;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: #333;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-section {
            display: none;
        }

        .tab-section.active {
            display: block;
        }

        .tab-section h3 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #f0f0f0;
        }

        .form-section h3 {
            color: #2c3e50;
            margin-top: 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .form-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-group small {
            color: #999;
            font-size: 0.9em;
            margin-top: 3px;
        }

        .image-upload-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-preview {
            width: 200px;
            height: 200px;
            background: #f5f5f5;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
        }

        .gallery-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }

        .gallery-item {
            position: relative;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .btn-remove {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-box {
            background: #f0f8ff;
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #3498db;
            margin-top: 15px;
        }

        .info-box p {
            margin: 0;
            color: #2c3e50;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .form-actions button, 
        .form-actions a {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            text-align: center;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            .form-tabs {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
                text-align: left;
                border-bottom: none;
                border-left: 3px solid transparent;
            }

            .tab-btn.active {
                border-left-color: #667eea;
                border-bottom: none;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .image-upload-section {
                flex-direction: column;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions button,
            .form-actions a {
                min-width: auto;
            }
        }
    </style>
</body>
</html>
