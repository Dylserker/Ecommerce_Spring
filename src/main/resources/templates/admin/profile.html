<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Profil & Paramètres</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin/profile.css}">
</head>
<body class="dashboard-page">
    <div th:replace="~{fragments/navbar :: admin-navbar('profile')}"></div>

    <div class="container">
        <div class="profile-container">
            <div class="profile-sidebar">
                <div class="profile-pic">Photo</div>
                <div class="profile-title">M / Mme</div>
                <div class="profile-name">Nom et prénom</div>
                <a th:href="@{/}" class="btn-secondary" style="text-decoration: none; display: block; text-align: center;">Déconnecter</a>
            </div>

            <div class="v-tabs-nav">
                <button class="v-tab-btn active" onclick="switchVTab('information', event)">Informations</button>
                <button class="v-tab-btn" onclick="switchVTab('addresses', event)">Adresses</button>
                <button class="v-tab-btn" onclick="switchVTab('orders', event)">Commandes</button>
            </div>

            <div class="profile-content">
                <div class="v-tabs-panel">
                    <div id="information" class="profile-section tab-content active">
                        <h2 class="section-title">Informations</h2>
                        <div class="profile-info">
                            <div class="info-group">
                                <div class="info-label">Nom</div>
                                <input class="info-value" name="lastName" value="Nom" readonly>
                            </div>
                            <div class="info-group">
                                <div class="info-label">Prénom</div>
                                <input class="info-value" name="firstName" value="Prénom" readonly>
                            </div>
                            <div class="info-group">
                                <div class="info-label">Email</div>
                                <input class="info-value" name="email" type="email" placeholder="email@example.com" value="email@example.com" readonly>
                            </div>
                            <div class="info-group">
                                <div class="info-label">Date de naissance</div>
                                <input class="info-value" name="birthDate" type="date" value="1990-01-01" readonly>
                            </div>
                        </div>
                        <div class="profile-actions" style="margin-top: 10px; gap: 10px;">
                            <button class="btn-secondary" id="editInfoBtn">Modifier les informations</button>
                            <button class="btn-primary hidden" id="saveInfoBtn">Confirmer</button>
                            <button class="btn-secondary hidden" id="cancelInfoBtn">Annuler</button>
                            <div class="account-actions">
                                <button class="btn-secondary">changer de mot de passe</button>
                                <button class="btn-danger">supprimer le compte</button>
                            </div>
                        </div>
                    </div>

                    <div id="addresses" class="profile-section tab-content">
                        <h2 class="section-title">Adresses</h2>
                        <div class="addresses-section">
                            <div class="address-actions" style="margin-top: 10px;">
                                <button class="btn-secondary open-address-modal" data-address-type="facturation">+ Ajouter une adresse de facturation</button>
                            </div>
                            <div class="address-actions" style="margin-top: 10px;">
                                <button class="btn-secondary open-address-modal" data-address-type="livraison">+ Ajouter une adresse de livraison</button>
                            </div>
                        </div>
                    </div>

                    <div id="orders" class="profile-section tab-content">
                        <h2 class="section-title">Commandes</h2>
                        <div class="orders-section">
                            <table class="orders-table">
                                <thead>
                                    <tr>
                                        <th>commande n°</th>
                                        <th>commandé effectué le</th>
                                        <th>montant total</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td th:text="${order.orderNumber}">commande n°</td>
                                        <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}">commandé effectué le</td>
                                        <td th:text="'€ ' + ${order.total}">montant total</td>
                                        <td>
                                            <a href="#" class="btn-secondary" style="display: inline-block; padding: 6px 12px; font-size: 12px; text-decoration: none;">Détail</a>
                                            <button class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">imprimer la facture</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="addressModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">Ajouter une adresse</h3>
                    <button type="button" class="modal-close" aria-label="Fermer">×</button>
                </div>
                <form id="addressForm" class="modal-body">
                    <div class="form-grid">
                        <label class="form-field">
                            <span>Type d'adresse</span>
                            <input type="text" id="addressType" name="addressType" readonly>
                        </label>
                        <label class="form-field">
                            <span>Nom et prénom</span>
                            <input type="text" id="fullName" name="fullName" placeholder="Nom Prénom" required>
                        </label>
                        <label class="form-field">
                            <span>Téléphone</span>
                            <input type="tel" id="phone" name="phone" placeholder="06 00 00 00 00" required>
                        </label>
                        <label class="form-field">
                            <span>Adresse</span>
                            <input type="text" id="street" name="street" placeholder="N° et rue" required>
                        </label>
                        <label class="form-field">
                            <span>Complément</span>
                            <input type="text" id="addressLine2" name="addressLine2" placeholder="Bâtiment, étage (optionnel)">
                        </label>
                        <label class="form-field">
                            <span>Ville</span>
                            <input type="text" id="city" name="city" placeholder="Ville" required>
                        </label>
                        <label class="form-field">
                            <span>Code postal</span>
                            <input type="text" id="zip" name="zip" placeholder="75000" required>
                        </label>
                        <label class="form-field">
                            <span>Pays</span>
                            <input type="text" id="country" name="country" value="France" required>
                        </label>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" id="cancelAddress">Annuler</button>
                        <button type="submit" class="btn-primary">Enregistrer l'adresse</button>
                    </div>
                </form>
            </div>
        </div>

    <script th:src="@{/js/admin/profile.js}"></script>
</body>
</html>
