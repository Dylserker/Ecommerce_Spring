<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard (public)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
    <div th:replace="~{fragments/public-navbar :: public-navbar}"></div>

    <div class="container">
        <div class="dashboard-grid">
            <div class="dashboard-section full-width">
                <h2>Produits phares</h2>
                <div class="product-grid">
                    <div class="product-card" th:each="product : ${featuredProducts}">
                        <div class="product-thumb">
                            <img th:src="${product['imageUrl']}" alt="Produit" style="width:100px;height:100px;object-fit:cover;">
                        </div>
                        <div class="product-info">
                            <div class="product-title" th:text="${product['name']}">Nom</div>
                            <div class="product-price" th:text="'€ ' + ${product['price']}">Prix</div>
                            <div class="product-actions">
                                <a th:href="@{/product/{id}(id=${product['id']})}" class="btn-view">Voir le produit</a>
                                <a th:href="@{/user/login}" class="btn-add-cart">Ajouter au panier</a>
                            </div>
                            <div class="notice">Connexion requise pour acheter</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dashboard-section">
                <h2>Produits populaires</h2>
                <div class="product-grid">
                    <div class="product-card" th:each="product : ${popularProducts}">
                        <div class="product-thumb">
                            <img th:src="${product['imageUrl']}" alt="Produit" style="width:100px;height:100px;object-fit:cover;">
                        </div>
                        <div class="product-info">
                            <div class="product-title" th:text="${product['name']}">Nom</div>
                            <div class="product-price" th:text="'€ ' + ${product['price']}">Prix</div>
                            <div class="product-actions">
                                <a th:href="@{/product/{id}(id=${product['id']})}" class="btn-view">Voir le produit</a>
                                <a th:href="@{/login}" class="btn-add-cart">Ajouter au panier</a>
                            </div>
                            <div class="notice">Connexion requise pour acheter</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="dashboard-section">
                <h2>En promotion</h2>
                <div class="product-grid">
                    <div class="product-card" th:each="product : ${promoProducts}">
                        <div class="product-thumb">
                            <img th:src="${product['imageUrl']}" alt="Produit" style="width:100px;height:100px;object-fit:cover;">
                        </div>
                        <div class="product-info">
                            <div class="product-title" th:text="${product['name']}">Nom</div>
                            <div class="product-price" th:text="'€ ' + ${product['price']}">Prix</div>
                            <div class="product-actions">
                                <a th:href="@{/product/{id}(id=${product['id']})}" class="btn-view">Voir le produit</a>
                                <a th:href="@{/login}" class="btn-add-cart">Ajouter au panier</a>
                            </div>
                            <div class="notice">Connexion requise pour acheter</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
