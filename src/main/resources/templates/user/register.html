<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" th:href="@{/css/user/register.css}">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>Register</h1>
        <form th:action="@{/user/register}" method="post" class="login-form">
            <div class="form-group">
                <label for="firstName">Nom</label>
                <input type="text" id="firstName" name="firstName" required placeholder="Entrez votre nom">
            </div>
            <div class="form-group">
                <label for="lastName">Prénom</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Entrez votre prénom">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Entrez votre email">
            </div>
            <div class="form-group">
                <label for="password">MDP</label>
                <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm MDP</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirmez votre mot de passe">
            </div>
            <div th:if="${param.error}" class="alert alert-error">
                Erreur lors de l'inscription. Veuillez réessayer.
            </div>
            <button type="submit" class="btn-primary">Bouton register</button>
            <div class="form-links">
                <p><a th:href="@{/user/login}" class="link-primary">Lien Login</a></p>
            </div>
        </form>
    </div>


</body>
</html>
