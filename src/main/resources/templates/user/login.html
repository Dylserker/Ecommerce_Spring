<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/user/login.css}">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>Login</h1>
        <form th:action="@{/user/login}" method="post" class="login-form">
            <div class="form-group">
                <label for="email">email</label>
                <input type="email" id="email" name="email" required placeholder="Entrez votre email">
            </div>
            <div class="form-group">
                <label for="password">MDP</label>
                <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
            </div>
            <div th:if="${param.error}" class="alert alert-error">
                Identifiants invalides
            </div>
            <button type="submit" class="btn-primary">Bouton Login</button>
            <div class="form-links">
                <p>Pas de compte? <a th:href="@{/user/register}" class="link-primary">Lien Register</a></p>
            </div>
        </form>
    </div>


</body>
</html>
