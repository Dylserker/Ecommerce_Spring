<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement - E-commerce</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/user/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/user/payment.css}">
</head>
<body class="dashboard-page">
    <div th:replace="~{fragments/navbar :: user-navbar}"></div>

    <div class="container">
        <div class="dashboard-grid">
            <div class="dashboard-section full-width">
                <h2>Finaliser votre achat</h2>
                <div class="payment-content">
                    <form th:action="@{/user/payment}" method="post" class="payment-form">
                    <div class="form-section">
                        <h2>Adresse de livraison</h2>
                        <div class="form-group">
                            <label for="name">Nom complet:</label>
                            <input type="text" id="name" name="name" required placeholder="Jean Dupont">
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required placeholder="jean@exemple.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Téléphone:</label>
                            <input type="tel" id="phone" name="phone" required placeholder="06 12 34 56 78">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="address">Adresse:</label>
                                <input type="text" id="address" name="address" required placeholder="123 Rue de l'Exemple">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">Ville:</label>
                                <input type="text" id="city" name="city" required placeholder="Paris">
                            </div>
                            <div class="form-group">
                                <label for="zip">Code postal:</label>
                                <input type="text" id="zip" name="zip" required placeholder="75000">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="country">Pays:</label>
                            <select id="country" name="country" required>
                                <option value="France">France</option>
                                <option value="Belgique">Belgique</option>
                                <option value="Suisse">Suisse</option>
                                <option value="Luxembourg">Luxembourg</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2>Mode de livraison</h2>
                        <div class="shipping-options">
                            <label class="shipping-option">
                                <input type="radio" name="shipping" value="standard" checked>
                                <span class="option-label">
                                    <strong>Livraison Standard</strong>
                                    <span class="option-info">5-7 jours ouvrables</span>
                                </span>
                                <span class="option-price">Gratuit</span>
                            </label>
                            <label class="shipping-option">
                                <input type="radio" name="shipping" value="express">
                                <span class="option-label">
                                    <strong>Livraison Express</strong>
                                    <span class="option-info">2-3 jours ouvrables</span>
                                </span>
                                <span class="option-price">€14,99</span>
                            </label>
                            <label class="shipping-option">
                                <input type="radio" name="shipping" value="overnight">
                                <span class="option-label">
                                    <strong>Livraison Next Day</strong>
                                    <span class="option-info">Livraison le lendemain</span>
                                </span>
                                <span class="option-price">€29,99</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2>Informations de paiement</h2>
                        <div class="payment-methods">
                            <label class="payment-method">
                                <input type="radio" name="paymentMethod" value="card" checked>
                                <span>💳 Carte bancaire</span>
                            </label>
                            <label class="payment-method">
                                <input type="radio" name="paymentMethod" value="paypal">
                                <span>🅿 PayPal</span>
                            </label>
                            <label class="payment-method">
                                <input type="radio" name="paymentMethod" value="transfer">
                                <span>🏦 Virement bancaire</span>
                            </label>
                        </div>

                        <div id="cardPayment" class="payment-details">
                            <div class="form-group">
                                <label for="card-name">Titulaire de la carte:</label>
                                <input type="text" id="card-name" name="cardName" required placeholder="Jean Dupont">
                            </div>
                            <div class="form-group">
                                <label for="card-number">Numéro de carte:</label>
                                <input type="text" id="card-number" name="cardNumber" placeholder="1234 5678 9012 3456" required maxlength="19">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="expiry">Date d'expiration:</label>
                                    <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required pattern="\d{2}/\d{2}" maxlength="5">
                                </div>
                                <div class="form-group">
                                    <label for="cvv">CVV:</label>
                                    <input type="text" id="cvv" name="cvv" placeholder="123" required maxlength="4">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">J'accepte les conditions générales de vente et la politique de confidentialité</label>
                    </div>
                    <div class="form-section checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">M'inscrire à la newsletter pour recevoir les offres exclusives</label>
                    </div>

                    <button type="submit" class="btn-primary btn-lg" style="width: 100%; padding: 15px; font-size: 1.1em;">Payer maintenant</button>
                </form>

                <div class="summary-card">
                    <h2>Résumé de commande</h2>
                    
                    <div class="order-items-list">
                        <div class="order-item" th:each="item : ${orderItems}">
                            <div class="item-info">
                                <span class="item-name" th:text="${item.product.name}">Produit</span>
                                <span class="item-qty" th:text="'x' + ${item.quantity}">x1</span>
                            </div>
                            <span class="item-price" th:text="'€ ' + ${item.quantity * item.product.price}">Prix</span>
                        </div>
                    </div>

                    <hr>

                    <div class="summary-details">
                        <div class="summary-line">
                            <span>Sous-total:</span>
                            <span th:text="'€ ' + ${subtotal}">0,00€</span>
                        </div>
                        <div class="summary-line">
                            <span>Livraison:</span>
                            <span id="shippingCost">Gratuit</span>
                        </div>
                        <div class="summary-line">
                            <span>TVA (20%):</span>
                            <span th:text="'€ ' + ${tax}">Calculée</span>
                        </div>
                    </div>

                    <hr>

                    <div class="summary-line total">
                        <span>Total:</span>
                        <span id="totalAmount" th:text="'€ ' + ${total}">0,00€</span>
                    </div>

                    <div class="order-info">
                        <p><strong>Numéro de commande:</strong> <span th:text="${orderId}">TEMPX2024xxxxx</span></p>
                        <p><strong>Date:</strong> <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}">Date</span></p>
                    </div>

                    <div class="security-badges">
                        <span class="badge">🔒 Paiement sécurisé SSL</span>
                        <span class="badge">✓ Données chiffrées</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('input[name="shipping"]').forEach(input => {
            input.addEventListener('change', function() {
                let cost = 'Gratuit';
                if (this.value === 'express') cost = '€14,99';
                if (this.value === 'overnight') cost = '€29,99';
                document.getElementById('shippingCost').textContent = cost;
            });
        });

        document.querySelectorAll('input[name="paymentMethod"]').forEach(input => {
            input.addEventListener('change', function() {
                const cardPayment = document.getElementById('cardPayment');
                cardPayment.style.display = this.value === 'card' ? 'block' : 'none';
            });
        });

        document.getElementById('card-number').addEventListener('input', function() {
            this.value = this.value.replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim();
        });

        document.getElementById('cvv').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 4);
        });
    </script>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
