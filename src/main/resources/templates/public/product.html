<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/user/product.css}">
</head>
<body class="dashboard-page">
    <div th:replace="~{fragments/public-navbar :: public-navbar}"></div>

    <div class="container">
        <a th:href="@{/products}" class="btn-secondary">← Retour</a>

        <div class="product-detail">
            <div class="product-image-section">
                <img th:src="${product.imageUrl}" alt="Produit" class="product-main-image">
                <div class="product-thumbnails">
                    <img th:src="${product.imageUrl}" alt="Miniature 1" class="thumbnail">
                    <img th:src="${product.imageUrl}" alt="Miniature 2" class="thumbnail">
                    <img th:src="${product.imageUrl}" alt="Miniature 3" class="thumbnail">
                </div>
            </div>

            <div class="product-info-section">
                <div class="breadcrumb">
                    <a th:href="@{/products}">Accueil</a> / <span th:text="${product.category}">Catégorie</span> / <span th:text="${product.name}">Produit</span>
                </div>

                <h1 th:text="${product.name}">Nom du produit</h1>

                <div class="rating-section" th:if="${product != null}">
                    <span class="stars" th:text="'★★★★★ ' + ${product.rating}"></span>
                    <span class="review-count" th:text="'(' + ${product.reviews} + ' avis)'"></span>
                </div>

                <div class="price-section">
                    <div class="price-display">
                        <span class="current-price" th:text="'€ ' + ${product.price}">€ 0,00</span>
                        <span class="original-price" th:if="${product.discount > 0}" th:text="'€ ' + ${product.originalPrice}"></span>
                        <span class="discount-badge" th:if="${product.discount > 0}" th:text="'Économisez ' + ${product.discount} + '%'"></span>
                    </div>
                    <div class="stock-status" th:classappend="${product.stock > 0 ? 'in-stock' : 'out-of-stock'}">
                        <span th:if="${product.stock > 0}">
                            <strong>✓ En stock</strong> - <span th:text="${product.stock} + ' articles disponibles'"></span>
                        </span>
                        <span th:if="${product.stock == 0}">
                            <strong>✗ Rupture de stock</strong>
                        </span>
                    </div>
                </div>

                <div class="login-notice" style="background: #FFF3E0; padding: 15px; border-radius: 8px; margin: 10px 0 20px 0; border-left: 4px solid #FF9800;">
                    <p style="margin: 0; color: #E65100; font-weight: 600;">⚠️ Connectez-vous pour ajouter au panier</p>
                    <a th:href="@{/user/login}" class="btn-primary" style="display: inline-block; margin-top: 10px; text-decoration: none;">Se connecter</a>
                    <span style="margin: 0 10px;">ou</span>
                    <a th:href="@{/user/register}}" class="btn-secondary" style="display: inline-block; text-decoration: none;">Créer un compte</a>
                </div>

                <div class="product-descriptif">
                    <h3>Description</h3>
                    <p th:text="${product.description}">Description détaillée du produit. Toutes les informations importantes sur les caractéristiques et les avantages.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
